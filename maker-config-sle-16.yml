package_submissions:
  # these 4 produce RPMs, from the main git repo
  agama: {}
  agama-products: {}
  agama-web-ui: {}
  rubygem-agama-yast: {}
  # also from the main repo, but produces an ISO
  agama-installer:
    gitea_submit:
      source_repo: "https://github.com/agama-project/agama/"
      source_branch: "SLE-16"
      source_run: "make -C live clean sles"
      source_dir: "live/dist"
      target_repo: "gitea@src.suse.de:products/SLES.git"
      target_dir: "agama-installer-SLES"
      target_branch: "16.0"

# no obs_submissions: maintenance updates do not go to Factory

# the maintenance branch, autosubmitted to its OBS project (obs-update)
obs_update:
  ref: "SLE-16"
  project: "systemsmanagement:Agama:Maintenance:SLE-16.0"

gitea_submissions:
  source_project: "Devel:YaST:Agama:Maintenance:SLE-16"
  # fork_org: USERNAME  # optional, defaults to the user of your tea login
  target_org: pool
  target_branch: slfo-1.2
